name: Build SA-MP APK from Catbox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Download & Extract from Catbox
        run: |
          wget -q --show-progress -O project.zip "https://files.catbox.moe/qoxn35.zip"
          unzip -q project.zip -d extracted_project

      - name: Build APK
        run: |
          TARGET_DIR=$(find extracted_project -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "Root project berada di: $TARGET_DIR"
          cd "$TARGET_DIR"

          # Hapus gradlew bawaan Windows dan buat ulang khusus versi Linux
          rm -f gradlew gradlew.bat
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alyn_sampmobile-APK
          path: "extracted_project/**/build/outputs/apk/release/*.apk"
