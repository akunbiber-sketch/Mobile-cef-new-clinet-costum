name: Build SA-MP APK from Catbox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install SDK 35 & NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Download & Extract from Catbox
        run: |
          wget -q --show-progress -O project.zip "https://files.catbox.moe/qoxn35.zip"
          unzip -q project.zip -d extracted_project

      - name: Auto Fix Headers, Case Sensitivity & Configs
        run: |
          APP_DIR=$(find extracted_project -name "build.gradle" | grep "/app" | head -n 1 | xargs dirname)
          if [ -n "$APP_DIR" ]; then
            if [ ! -f "$APP_DIR/google-services.json" ]; then
              echo '{"project_info":{"project_number":"123456789","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456","android_client_info":{"package_name":"ro.alynsampmobile.launcher"}},"api_key":[{"current_key":"dummy"}]}]}' > "$APP_DIR/google-services.json"
            fi
            sed -i 's/compileSdk 34/compileSdk 35/g' "$APP_DIR/build.gradle" 2>/dev/null || true
            sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' "$APP_DIR/build.gradle" 2>/dev/null || true
            sed -i 's/compileSdk = 34/compileSdk = 35/g' "$APP_DIR/build.gradle" 2>/dev/null || true
            sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/g' "$APP_DIR/build.gradle" 2>/dev/null || true
          fi

          # Inject #pragma once ke baris terbawah/teratas semua header agar tidak redefinition error
          find extracted_project -type f \( -iname "*.h" -o -iname "*.hpp" \) | while read -r file; do
            if ! grep -q "#pragma once" "$file"; then
              echo -e "#pragma once\n$(cat "$file")" > "$file"
            fi
          done

          # Sinkronisasi nama file header (huruf besar & kecil)
          find extracted_project -type f \( -iname "*.h" -o -iname "*.hpp" \) | while read -r file; do
            dir=$(dirname "$file")
            filename=$(basename "$file")
            cap_name="$(tr '[:lower:]' '[:upper:]' <<< ${filename:0:1})${filename:1}"
            
            cp -n "$file" "$dir/$cap_name" 2>/dev/null || true
            mkdir -p "$dir/include" 2>/dev/null || true
            cp -n "$file" "$dir/include/$cap_name" 2>/dev/null || true
            cp -n "$file" "$dir/include/$filename" 2>/dev/null || true
          done

      - name: Build APK
        run: |
          TARGET_DIR=$(find extracted_project -name "settings.gradle" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"

          rm -f gradlew gradlew.bat
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew

          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393

          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alyn_sampmobile-APK
          path: "extracted_project/**/build/outputs/apk/debug/*.apk"
