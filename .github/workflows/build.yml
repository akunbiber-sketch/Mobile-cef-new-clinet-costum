name: Build SA-MP Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 25.1.8937393
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Auto-Detect Project Folder & Build
        run: |
          TARGET_DIR=$(find . -maxdepth 3 -name "settings.gradle" -o -name "build.gradle" | head -n 1 | xargs dirname)
          echo "Folder proyek ditemukan di: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alyn_sampmobile-APK
          path: "**/build/outputs/apk/release/*.apk"
