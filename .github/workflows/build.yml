name: Build SA-MP APK from Catbox

on:
  workflow_dispatch: # Ini biar lu bisa klik tombol "Run workflow" manual di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 25.1.8937393
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Sedot Source Code dari Catbox
        run: |
          echo "Mulai download file 98MB dari Catbox..."
          wget -q --show-progress -O project.zip "https://files.catbox.moe/qoxn35.zip"

      - name: Ekstrak File ZIP
        run: |
          unzip -q project.zip -d extracted_project
          echo "Beres diekstrak!"

      - name: Build APK Otomatis
        run: |
          # Nyari folder proyeknya di dalam hasil ekstrakan
          TARGET_DIR=$(find extracted_project -name "build.gradle" | head -n 1 | xargs dirname)
          echo "Masuk ke folder: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Bikin Gradle Wrapper kalau lu lupa masukin
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          # Kasih izin eksekusi dan gas Build
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: alyn_sampmobile-APK
          # Nyari file APK-nya otomatis
          path: "extracted_project/**/build/outputs/apk/release/*.apk"
